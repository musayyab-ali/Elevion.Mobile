name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform android
        env:
          EXPO_PUBLIC_API_URL: http://localhost:5241/api/v1
          EXPO_PUBLIC_API_URL_TWO: http://localhost:5241/api/v2
          EXPO_PUBLIC_API_KEY: ci
